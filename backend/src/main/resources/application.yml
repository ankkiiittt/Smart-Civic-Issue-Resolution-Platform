server:
  port: 8080

spring:
  application:
    name: smart-civic-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_civic}${DB_PARAMS:}}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:170525}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:9a4f2c8d3e1b7f0a5c8d3e1b7f0a5c8d3e1b7f0a5c8d3e1b7f0a5c8d3e1b7f0a}
  expiration: 86400000 # 24 hours in ms

storage:
  local:
    upload-dir: ${UPLOAD_DIR:./uploads}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
